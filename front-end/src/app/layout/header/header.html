<header class="navbar">
    <div class="brand">
        <h1>Red Social</h1>
    </div>

    <nav class="nav-links">
        <a routerLink="/home" routerLinkActive="active">🏠 Publicaciones</a>

        @if (authService.currentUser()) {
            <a *appRole="'administrador'" routerLink="/dashboard/usuarios" routerLinkActive="active">
                Lista Usuarios
            </a>

            <a *appRole="'administrador'" routerLink="/dashboard/estadisticas" routerLinkActive="active">
                Estadisticas
            </a>

            <a routerLink="/perfil" routerLinkActive="active">👤 Mi perfil</a>

            <a href="#" (click)="logout(); $event.preventDefault()">🚪 Cerrar sesion</a>
        } @else {
            <a routerLink="/login" routerLinkActive="active">🔑 Iniciar sesion</a>
        }
    </nav>
</header>
