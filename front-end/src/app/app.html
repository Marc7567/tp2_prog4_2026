<app-header />
<main class="content">
  <div class="route-container">
    <router-outlet />
  </div>
</main>
<app-footer />

@if (auth.mostrarRenovacion()) {
  <div class="modal-overlay">
    <section
      class="session-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="session-title"
    >
      <h2 id="session-title">Tu sesion esta por vencer</h2>

      <p>
        Tu sesion vencera en aproximadamente 3 minutos.
        Queres extenderla para seguir usando la aplicacion?
      </p>

      <div class="modal-actions">
        <button
          type="button"
          class="btn-extend"
          (click)="renovarSesion()"
        >
          Extender sesion
        </button>

        <button
          type="button"
          class="btn-logout"
          (click)="continuarSesion()"
        >
          Continuar
        </button>
      </div>
    </section>
  </div>
}

@if (auth.mostrarExpiracion()) {
  <div class="modal-overlay">
    <section
      class="session-modal"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="expired-title"
    >
      <h2 id="expired-title">Tu sesion ha vencido</h2>

      <p>Se acabo el tiempo de tu sesion.</p>
    </section>
  </div>
}
